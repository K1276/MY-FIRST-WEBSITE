<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haryana Hood - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
            padding: 10px;
            animation: slideIn 1s ease-in-out;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            animation: fadeInUp 1.5s ease-in-out;
            text-align: center;
        }
        .container img {
            width: 100%;
            max-width: 600px;
            height: auto;
            margin-top: 20px;
            border-radius: 10px;
        }
        footer {
            text-align: center;
            padding: 10px;
            background: #333;
            color: white;
            margin-top: 20px;
            animation: fadeIn 2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Haryana Hood</h1>
    </header>
    <nav>
        <a href="hood.html">Home</a>
        <a href="ahood.html">About</a>
        <a href="hcontact.html">Contact</a>
    </nav>
    <div class="container">
        <h2>Welcome to Haryana Hood</h2>
        <p>Your go-to brand for authentic and stylish clothing inspired by Haryana culture.</p>
        <img src="about-image.jpg.jpg" alt="Haryana Hood Clothing">
    </div>
</body>
</html>
